# obs-stack/grafana/provisioning/datasources/datasources.yml
# Grafana 数据源自动注入 (启动时加载, 无需手动在 UI 配置).
#
# 数据源:
# - Prometheus: 指标存储与查询 (默认数据源), 用于指标大盘面板;
#   启用 Exemplar 钻取: 指标图表上的数据点可跳转到对应 Tempo trace;
# - Tempo: Trace 链路查询 (Grafana 原生集成), 支持 TraceQL + trace→metrics 钻取.
#   替换原 Jaeger 数据源, 提供更强的查询与关联能力.

apiVersion: 1

# 启动时删除旧 Jaeger 数据源 (已替换为 Tempo, 防止残留无效数据源)
deleteDatasources:
  - name: Jaeger
    orgId: 1

datasources:
  # ---- Prometheus: 指标存储 (默认数据源) + Exemplar → Tempo 钻取 ----
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true
    jsonData:
      # Exemplar 钻取: 在指标图表上 hover 数据点, 点击 trace_id 跳转到 Tempo 对应链路
      # 需要 Python 侧 OTel span 携带 exemplar trace_id (OTel SDK 默认支持)
      exemplarTraceIdDestinations:
        - name: trace_id           # OTel span 的 trace_id 字段名
          datasourceUid: tempo     # 指向 Tempo 数据源

  # ---- Tempo: Trace 查询 (Grafana 原生, 替换原 Jaeger) ----
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200         # Tempo HTTP API (TraceQL / 查询)
    uid: tempo
    isDefault: false
    editable: true
    jsonData:
      # trace → 指标钻取 (在 trace 视图跳转到对应 Prometheus 指标)
      tracesToMetrics:
        datasourceUid: prometheus
      # 服务拓扑图 (Service Graph, 展示服务间调用关系)
      serviceMap:
        datasourceUid: prometheus
      # 启用 TraceQL 搜索面板 (Grafana Explore 中按标签/属性搜索 trace)
      search:
        hide: false
      # Node Graph: 以节点图形式展示 trace 调用树
      nodeGraph:
        enabled: true
